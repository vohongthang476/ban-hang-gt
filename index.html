<title>TVwin Bán Hàng GT</title>
<style>
:root{--g:#0a2f5e;--g2:#f26412;--gl:#eaf0f8;--ok:#138a4a;--y:#f5b800;--r:#d93636;--b:#1f5fbf;--ink:#1c2621;--mut:#6b7a72;--line:#e2e8e4;--bg:#f4f7f5;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:78px}
header{background:linear-gradient(135deg,#082e5d,#12417c);border-bottom:3px solid var(--g2);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;flex:1}header small{display:block;font-weight:400;opacity:.85;font-size:12px}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:16px}
main{max-width:820px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}nav button.on{color:var(--g2);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:19px;margin-top:3px}
.bar{height:10px;background:#e8ece9;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3d,var(--g2))}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--g);color:#fff;cursor:pointer}
.btn.s{padding:7px 10px;font-size:13px}.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.y{background:var(--g2);color:#fff}.btn.r{background:var(--r)}.btn.b{background:var(--b)}.btn.gr{background:#eef1ef;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs button{border:0;background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button.on{background:var(--g);color:#fff}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2)}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border-bottom:1px solid var(--line);padding:10px 0}.item:last-child{border:0}
.item .t{font-weight:600}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:var(--gl);color:var(--g);margin:2px 3px 2px 0;font-weight:600}
.tag.y{background:#fff4cc;color:#7a5b00}.tag.r{background:#fde7e7;color:var(--r)}.tag.b{background:#e5eefc;color:var(--b)}.tag.gr{background:#eef1ef;color:#555}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts a,.acts button{font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600}
.acts .go{background:var(--g2);color:#fff;border-color:var(--g2)}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--r);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#mbox{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 90px}
#mbox .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
#mbox .mh h2{font-size:17px}
.sticky-foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:60;display:none}
.line{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.opt.best{border-color:var(--g2);background:#fff6ef}
.opt .h{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;font-size:12px;color:var(--mut)}.nums b{display:block;color:var(--ink);font-size:14px}
details{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none}summary::after{content:'＋';float:right;color:var(--mut)}details[open] summary::after{content:'－'}
details .in{padding:0 14px 14px;line-height:1.55}details .in p{margin:6px 0}details .in li{margin:4px 0 4px 18px}
.say{background:var(--gl);border-left:4px solid var(--g2);padding:8px 10px;border-radius:0 8px 8px 0;margin:6px 0;font-style:italic}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}
.r{text-align:right}.empty{text-align:center;color:var(--mut);padding:24px 8px}
.stock0{color:var(--r);font-weight:700}.stockok{color:var(--ok);font-weight:700}
.big{width:100%;padding:14px;font-size:16px}
.pc{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.pc:active{background:var(--gl)}.pc b{font-size:14px;line-height:1.3}
.th{width:54px;height:54px;border-radius:10px;flex:none;object-fit:cover;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:26px}
.th.l{width:84px;height:84px;font-size:38px}
#picker{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column}
#picker .ph{padding:10px 12px 8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#picker .pl{flex:1;overflow:auto;padding:10px 12px 30px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:7px 11px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.catgrid button{background:#fff;border:0;border-radius:12px;padding:12px 4px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;gap:4px}
.catgrid button b{font-size:24px;font-weight:400}
#aiFab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--g2);box-shadow:0 4px 14px rgba(242,100,18,.45);z-index:40;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
#aiFab small{position:absolute;bottom:-16px;font-size:10px;color:var(--g);font-weight:700;white-space:nowrap}
#ai{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.aih{display:flex;gap:10px;align-items:center;padding:10px 12px;background:linear-gradient(135deg,#082e5d,#12417c);color:#fff;border-bottom:3px solid var(--g2)}
.aih img{width:36px;height:36px;border-radius:9px;background:#fff;padding:2px;object-fit:contain}.aih small{display:block;opacity:.8;font-size:11px}
.aim{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bu{align-self:flex-end;background:var(--g);color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;max-width:85%;white-space:pre-wrap}
.bu .mut{color:#cfe0f5}
.ba{align-self:flex-start;background:#fff;padding:10px 12px;border-radius:14px 14px 14px 4px;max-width:94%;box-shadow:0 1px 3px rgba(0,0,0,.07);line-height:1.5}
.aiw{background:#fff;border-radius:14px;padding:14px;text-align:left;line-height:1.55}.aiw img{width:54px;height:54px;object-fit:contain}
.aiin{background:#fff;border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.aiin textarea{resize:none;min-height:44px;max-height:120px}
.aib{flex:none;width:42px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.aib.on{background:var(--g2);border-color:var(--g2);animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.aifl{padding:0 10px}.aiwarn{margin-top:6px;color:#8a4b00;font-size:13px}
.act{border:1.5px solid var(--g2);border-radius:12px;padding:10px;margin-top:8px;background:#fffaf5}.act.done{border-color:var(--line);background:#f4f7f5;font-size:13px}
.act select.bad,.act .bad{border-color:var(--r);background:#fff5f5}.aitem{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.dots::after{content:'…';animation:pl 1s infinite}
@media(max-width:420px){body{font-size:14px}main{padding:10px}.card{padding:12px}.g3{grid-template-columns:1fr 1fr}}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>

function defState(){return{settings:{seller:'',npp:'',target:93500000,level:1,margin:8,costBasis:'net',leMarkup:10,cycle:10},prod:{},stores:[],visits:[],imports:[],orders:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S)S=defState();const d=defState();S.settings=Object.assign(d.settings,S.settings||{});['stores','visits','imports','orders'].forEach(k=>S[k]=S[k]||[]);S.prod=S.prod||{};S.custom=S.custom||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Không lưu được – hãy Sao lưu JSON')}}
load();

/* ================== SẢN PHẨM ================== */
let PRODUCTS=[],PM={};
function buildProducts(){
 PRODUCTS=RAW.concat(S.custom||[]).map(r=>{const o=S.prod[r[0]]||{};return{code:r[0],name:r[1],brand:r[2],group:r[3],unit:r[4],pack:r[5],retail:r[6],npp:r[7],buy:r[8],gift:r[9]||r[0],giftQty:r[10],isNew:NEW_GROUPS.includes(r[3]),cost:o.cost,price:o.price,priceLe:o.priceLe,adj:o.adj||0,custom:!!r[11]}});
 PM={};PRODUCTS.forEach(p=>PM[p.code]=p)}
buildProducts();
function netOf(p,field){field=field||'retail';const g=PM[p.gift]||p;
 if(g.code===p.code)return p[field]*p.buy/(p.buy+p.giftQty);
 return (p[field]*p.buy-p.giftQty*netOf(g,field))/p.buy}
function baseCost(p){const b=S.settings.costBasis;if(b==='npp')return p.npp;if(b==='nppnet')return Math.round(netOf(p,'npp'));return Math.round(netOf(p))}
function cost(p){return p.cost!=null&&p.cost!==''?+p.cost:baseCost(p)}
function price(p){return p.price!=null&&p.price!==''?+p.price:p.retail}
function priceLe(p){return p.priceLe!=null&&p.priceLe!==''?+p.priceLe:Math.ceil(p.retail*(1+S.settings.leMarkup/100)/1000)*1000}
function promoText(p){const g=PM[p.gift]||p;return g.code===p.code?`Mua ${p.buy} tặng ${p.giftQty} ${p.unit.toLowerCase()}`:`Mua ${p.buy} ${p.unit.toLowerCase()} tặng ${p.giftQty} ${g.unit.toLowerCase()} ${g.name}`}
function setProd(code,k,v){S.prod[code]=S.prod[code]||{};S.prod[code][k]=v;save();buildProducts()}

/* ================== TIỆN ÍCH ================== */
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(+n||0)).toLocaleString('vi-VN');
const fm=n=>{n=+n||0;const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+' tỷ':a>=1e6?(n/1e6).toFixed(1)+' tr':fmt(n)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(ds,n)=>{const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dmy=s=>s?s.split('-').reverse().join('/'):'';
const month=()=>today().slice(0,7);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function openModal(title,html,foot){$('mbox').innerHTML=`<div class="mh"><h2>${title}</h2><button class="btn gr s" onclick="closeModal()">✕ Đóng</button></div>${html}`;$('modal').classList.add('on');$('mbox').scrollTop=0;
 const f=$('sfoot');if(foot){f.innerHTML=foot;f.style.display='block'}else f.style.display='none'}
function closeModal(){$('modal').classList.remove('on');$('sfoot').style.display='none';render()}
function stockMap(){const m={};PRODUCTS.forEach(p=>m[p.code]=p.adj||0);
 S.imports.forEach(im=>im.items.forEach(it=>{m[it.code]=(m[it.code]||0)+(+it.qty||0)+(+it.free||0)}));
 S.orders.forEach(o=>o.items.forEach(it=>{m[it.code]=(m[it.code]||0)-(+it.qty||0);(it.gifts||[]).forEach(g=>m[g.code]=(m[g.code]||0)-(+g.qty||0))}));return m}
function orderCalc(o){let rev=0,c=0;o.items.forEach(it=>{const r=it.qty*it.price*(1-(it.disc||0)/100);rev+=r;c+=it.qty*it.cost;(it.gifts||[]).forEach(g=>c+=g.qty*g.cost)});return{rev,cost:c,profit:rev-c}}
function storeName(id){const s=S.stores.find(x=>x.id===id);return s?s.name:'Khách lẻ'}
function lastOrder(id){let d='';S.orders.forEach(o=>{if(o.storeId===id&&o.date>d)d=o.date});return d}
function debtOf(id){return S.orders.filter(o=>o.storeId===id).reduce((a,o)=>a+Math.max(0,orderCalc(o).rev-(o.paid||0)),0)}

/* ============ VỊ TRÍ & GOOGLE MAPS ============ */
let POS=null;
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej('Máy không hỗ trợ định vị');
 navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};res(POS)},e=>rej('Chưa cho phép định vị (bật GPS & cho phép trình duyệt)'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
function dist(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function locStr(s){return s.lat!=null&&s.lat!==''?`${s.lat},${s.lng}`:(s.address||s.name)+', Nghệ An'}
function dirUrl(s){if((s.lat==null||s.lat==='')&&s.mapUrl)return s.mapUrl;return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(locStr(s))}&travelmode=driving`}
function parseMapLink(u){if(!u)return null;let m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/)||u.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)\s*$/);
 return m?{lat:+m[1],lng:+m[2]}:null}
function searchNear(q){const base='https://www.google.com/maps/search/'+encodeURIComponent(q);
 if(POS)return window.open(`${base}/@${POS.lat},${POS.lng},16z`,'_blank');
 getPos().then(p=>window.open(`${base}/@${p.lat},${p.lng},16z`,'_blank')).catch(()=>window.open(base+'+gần+đây','_blank'))}

/* ================== ĐIỀU HƯỚNG ================== */
let TAB='home',SUB={};
const TABS=[['home','🏠','Tổng quan'],['stores','📍','Cửa hàng'],['sales','🛒','Bán hàng'],['stock','📦','Kho'],['promo','🎁','Tính KM'],['guide','💬','Tư vấn']];
function go(t){TAB=t;render();window.scrollTo(0,0)}
function render(){ $('nav').innerHTML=TABS.map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('hsub').textContent=(S.settings.seller?S.settings.seller+' · ':'thangvo.win · ')+'SWAT · Solhome · Grasse';
 ({home:vHome,stores:vStores,sales:vSales,stock:vStock,promo:vPromo,guide:vGuide})[TAB]()}
</script>
<script>
/* ================== TỔNG QUAN ================== */
function monthStats(m){const os=S.orders.filter(o=>o.date.slice(0,7)===m);let rev=0,pf=0,grasse=0;
 os.forEach(o=>{const c=orderCalc(o);rev+=c.rev;pf+=c.profit;o.items.forEach(it=>{const p=PM[it.code];if(p&&p.brand==='Grasse')grasse+=it.qty/p.pack})});
 return{os,rev,pf,grasse}}
function bonusEst(rev){const st=S.settings,t=+st.target,pct=t?rev/t*100:0;const col=BONUS.cols.indexOf(t);
 if(pct<50)return{pct,bonus:0,note:'Dưới 50% chỉ tiêu → tính theo chính sách Đại lý (DS × 8%, không phụ cấp)',agent:rev*0.08};
 let b=0;if(col>=0)BONUS.rows.forEach(r=>{if(pct>=r[0])b=r[col+1]});return{pct,bonus:b,note:col<0?'Chọn chỉ tiêu 77 / 93,5 / 115,5 tr trong Cài đặt để tính thưởng':''}}
function vHome(){const m=monthStats(month()),sm=stockMap();const st=S.settings;
 let stockVal=0;PRODUCTS.forEach(p=>{if(sm[p.code]>0)stockVal+=sm[p.code]*cost(p)});
 const debt=S.orders.reduce((a,o)=>a+Math.max(0,orderCalc(o).rev-(o.paid||0)),0);
 const be=bonusEst(m.rev),gb=Math.floor(m.grasse)*80000;
 const due=dueStores();const newS=S.stores.filter(s=>(s.created||'').slice(0,7)===month()).length;
 const low=PRODUCTS.filter(p=>sm[p.code]>0&&sm[p.code]<p.pack).length;
 const vis=S.visits.filter(v=>v.date===today()).length;
 $('app').innerHTML=`
 <div class="kpis">
  <div class="kpi"><span>Doanh số tháng ${month().slice(5)}</span><b>${fm(m.rev)}</b></div>
  <div class="kpi"><span>Lãi gộp tháng</span><b class="${m.pf>=0?'pos':'neg'}">${fm(m.pf)}</b></div>
  <div class="kpi"><span>Tồn kho (giá vốn)</span><b>${fm(stockVal)}</b></div>
  <div class="kpi"><span>Công nợ phải thu</span><b class="${debt?'neg':''}">${fm(debt)}</b></div>
 </div>
 <div class="card"><h3>🎯 Chỉ tiêu & thu nhập ước tính</h3>
  <div class="row"><span class="grow">Đạt <b>${be.pct.toFixed(0)}%</b> / chỉ tiêu ${fm(st.target)}</span><span class="mut">còn ${fm(Math.max(0,st.target-m.rev))}</span></div>
  <div class="bar"><i style="width:${Math.min(100,be.pct/1.5)}%"></i></div>
  <table><tr><td>Lương căn bản (bậc ${st.level})</td><td class="r">${fmt(BASE[st.level])}</td></tr>
  <tr><td>Thưởng doanh số</td><td class="r">${fmt(be.bonus)}</td></tr>
  <tr><td>Thưởng Grasse (${Math.floor(m.grasse)} thùng × 80k)</td><td class="r">${fmt(gb)}</td></tr>
  <tr><td>Lãi gộp chênh lệch giá của bạn</td><td class="r">${fmt(m.pf)}</td></tr>
  <tr><th>Tổng ước tính</th><th class="r pos">${fmt(BASE[st.level]+be.bonus+gb+m.pf)}</th></tr></table>
  ${be.note?`<p class="mut" style="margin-top:6px">⚠️ ${be.note}${be.agent?': '+fmt(be.agent):''}</p>`:''}
  <p class="mut" style="margin-top:6px">${nextTierTip(m.rev)}</p>
 </div>
 <div class="card" onclick="openAI()" style="cursor:pointer;display:flex;gap:10px;align-items:center;border:1.5px solid var(--g2)"><div style="font-size:30px">🤖</div><div class="grow"><b>Hỏi Trợ lý TVwin</b><div class="mut">“rửa bát can lớn giá bao nhiêu?”, “quán ăn nên chào gì?”, chụp phiếu nhập NPP…</div></div><b style="color:var(--g2)">›</b></div>
 ${focusCard()}
 <div class="card"><h3>📅 Hôm nay</h3>
  <div class="row"><span class="tag b">${vis} lượt ghé hôm nay</span><span class="tag">${m.os.length} đơn tháng này</span><span class="tag y">${newS} cửa hàng mới tháng này</span>${low?`<span class="tag r">${low} mã sắp hết</span>`:''}</div>
  <div class="acts"><button class="go" onclick="newOrder()">＋ Tạo đơn</button><button onclick="editStore()">＋ Cửa hàng</button><button onclick="newImport()">＋ Nhập hàng</button><button onclick="go('stores');SUB.st='route'">🗺️ Lộ trình</button></div>
 </div>
 <div class="card"><h3>🔔 Cần ghé (${due.length})</h3>${due.length?due.slice(0,8).map(s=>storeRow(s,true)).join(''):'<div class="empty">Chưa có lịch. Thêm cửa hàng & ghi kết quả ghé thăm để app tự nhắc.</div>'}</div>
 <div class="card"><h3>🔎 Tìm cửa hàng mới quanh đây</h3><p class="mut">Mở Google Maps tìm quanh vị trí hiện tại, ghé từng điểm rồi bấm “＋ Cửa hàng” để lưu tọa độ.</p>
  <div class="acts">${['tạp hóa','quán ăn','nhà hàng','khách sạn','nhà nghỉ','tiệm giặt là','salon tóc','siêu thị mini','trường mầm non'].map(q=>`<button onclick="searchNear('${q}')">${q}</button>`).join('')}</div></div>
 <div class="card"><h3>🏆 Bán chạy tháng này</h3>${topProducts(m.os)}</div>`}
function nextTierTip(rev){const t=+S.settings.target;if(!t)return'';const p=rev/t*100;const nx=BONUS.rows.find(r=>r[0]>p);if(!nx)return'🔥 Đã vượt mốc 150%!';
 return `👉 Cần thêm <b>${fm(nx[0]/100*t-rev)}</b> để lên mốc ${nx[0]}%.`}
function topProducts(os){const m={};os.forEach(o=>o.items.forEach(it=>{m[it.code]=(m[it.code]||0)+it.qty*it.price*(1-(it.disc||0)/100)}));
 const a=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,5);if(!a.length)return'<div class="empty">Chưa có đơn.</div>';
 return a.map(([c,v])=>`<div class="item row"><span class="grow">${esc(PM[c]?.name||c)}</span><b>${fm(v)}</b></div>`).join('')}
function dueStores(){const t=today(),cyc=+S.settings.cycle||10;
 return S.stores.filter(s=>{if(s.status==='tc')return false;if(s.nextVisit&&s.nextVisit<=t)return true;const lo=lastOrder(s.id);return lo&&(s.status==='quen'||s.status==='mua')&&addDays(lo,cyc)<=t})
 .sort((a,b)=>(a.nextVisit||'9')<(b.nextVisit||'9')?-1:1)}

/* ================== CỬA HÀNG & LỘ TRÌNH ================== */
function storeRow(s,compact){const d=POS?dist(POS,s):null,lo=lastOrder(s.id),db=debtOf(s.id),stt=STATUS[s.status||'tn'];
 return `<div class="item"><div class="row"><span class="t grow">${esc(s.name)}</span>${d!=null?`<span class="tag b">${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}</span>`:''}</div>
 <div class="mut">${esc(s.owner||'')}${s.owner?' · ':''}${esc(s.address||'Chưa có địa chỉ')}</div>
 <div><span class="tag ${stt[1]}">${stt[0]}</span><span class="tag gr">${esc(s.type||'')}</span>${s.area?`<span class="tag gr">${esc(s.area)}</span>`:''}${lo?`<span class="tag">Mua gần nhất ${dmy(lo)}</span>`:''}${s.nextVisit?`<span class="tag y">Hẹn ${dmy(s.nextVisit)}</span>`:''}${db?`<span class="tag r">Nợ ${fm(db)}</span>`:''}${s.lat==null||s.lat===''?'<span class="tag r">Chưa ghim vị trí</span>':''}${S.focus.length&&!hasFocus(s.id)&&s.type!=='Khách lẻ'?'<span class="tag y">⭐ Chưa có mã trọng tâm</span>':''}</div>
 <div class="acts"><a class="go" href="${esc(dirUrl(s))}" target="_blank">🧭 Chỉ đường</a>${s.phone?`<a href="tel:${esc(s.phone)}">📞</a><a href="https://zalo.me/${esc(s.phone.replace(/\D/g,''))}" target="_blank">Zalo</a>`:''}<button onclick="visit('${s.id}')">✅ Ghé thăm</button><button onclick="newOrder('${s.id}')">🛒 Đơn</button>${compact?'':`<button onclick="toggleRoute('${s.id}')">${(SUB.route||[]).includes(s.id)?'➖ Bỏ tuyến':'➕ Tuyến'}</button>`}<button onclick="editStore('${s.id}')">✏️</button></div></div>`}
function vStores(){SUB.st=SUB.st||'list';const q=(SUB.q||'').toLowerCase(),fa=SUB.fa||'',fs=SUB.fs||'';
 const areas=[...new Set(S.stores.map(s=>s.area).filter(Boolean))];
 let list=S.stores.filter(s=>(!q||(s.name+' '+(s.owner||'')+' '+(s.address||'')+' '+(s.phone||'')).toLowerCase().includes(q))&&(!fa||s.area===fa)&&(!fs||s.status===fs));
 if(POS)list.sort((a,b)=>(dist(POS,a)??1e9)-(dist(POS,b)??1e9));
 const tabs=`<div class="tabs"><button class="${SUB.st==='list'?'on':''}" onclick="SUB.st='list';render()">Danh sách (${S.stores.length})</button><button class="${SUB.st==='route'?'on':''}" onclick="SUB.st='route';render()">🗺️ Lộ trình hôm nay (${(SUB.route||[]).length})</button><button class="${SUB.st==='visits'?'on':''}" onclick="SUB.st='visits';render()">Nhật ký ghé thăm</button></div>`;
 if(SUB.st==='route')return $('app').innerHTML=tabs+vRoute();
 if(SUB.st==='visits')return $('app').innerHTML=tabs+vVisits();
 $('app').innerHTML=tabs+`<div class="card">
 <div class="row"><input class="grow" style="flex:1" placeholder="🔍 Tìm tên, SĐT, địa chỉ..." value="${esc(SUB.q||'')}" oninput="SUB.q=this.value;clearTimeout(window._sq);window._sq=setTimeout(()=>{render();const i=document.querySelector('#app input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)"><button class="btn" onclick="editStore()">＋ Thêm</button></div>
 <div class="g3" style="margin-top:8px"><select onchange="SUB.fa=this.value;render()"><option value="">Mọi khu vực</option>${areas.map(a=>`<option ${a===fa?'selected':''}>${esc(a)}</option>`).join('')}</select>
 <select onchange="SUB.fs=this.value;render()"><option value="">Mọi trạng thái</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===fs?'selected':''}>${v[0]}</option>`).join('')}</select>
 <button class="btn o s" onclick="getPos().then(()=>{toast('Đã lấy vị trí – sắp xếp gần nhất');render()}).catch(e=>toast(e))">📍 Gần tôi</button></div></div>
 <div class="card">${list.length?list.map(s=>storeRow(s)).join(''):'<div class="empty">Chưa có cửa hàng. Bấm “＋ Thêm” khi đứng tại cửa hàng để ghim vị trí GPS.</div>'}</div>`}
function toggleRoute(id){SUB.route=SUB.route||[];const i=SUB.route.indexOf(id);i<0?SUB.route.push(id):SUB.route.splice(i,1);try{localStorage.setItem(KEY+'_route',JSON.stringify(SUB.route))}catch(e){}render()}
try{SUB.route=JSON.parse(localStorage.getItem(KEY+'_route'))||[]}catch(e){SUB.route=[]}
function vRoute(){const r=(SUB.route||[]).map(id=>S.stores.find(s=>s.id===id)).filter(Boolean);
 const due=dueStores().filter(s=>!SUB.route.includes(s.id));
 return `<div class="card"><h3>🗺️ Tuyến hôm nay</h3><p class="mut">Thêm cửa hàng vào tuyến (nút ➕ Tuyến ở Danh sách) → bấm “Tối ưu thứ tự” → “Mở Google Maps” để đi lần lượt từng điểm.</p>
 <div class="acts"><button onclick="optimizeRoute()">⚡ Tối ưu thứ tự (gần nhất trước)</button><button class="go" onclick="openRoute()">🧭 Mở cả tuyến trên Google Maps</button><button onclick="SUB.route=[];toggleRoute('_')">🗑️ Xóa tuyến</button></div></div>
 <div class="card">${r.length?r.map((s,i)=>`<div class="row"><b style="width:24px">${i+1}.</b><div class="grow">${storeRow(s,true)}</div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn gr s" onclick="mvRoute(${i},-1)">▲</button><button class="btn gr s" onclick="mvRoute(${i},1)">▼</button><button class="btn gr s" onclick="toggleRoute('${s.id}')">✕</button></div></div>`).join(''):'<div class="empty">Tuyến trống.</div>'}</div>
 ${due.length?`<div class="card"><h3>Gợi ý thêm vào tuyến (đến hạn ghé)</h3>${due.map(s=>`<div class="item row"><span class="grow">${esc(s.name)} <span class="mut">${esc(s.area||'')}</span></span><button class="btn s" onclick="toggleRoute('${s.id}')">➕</button></div>`).join('')}<div class="acts"><button onclick="due_all()">➕ Thêm tất cả</button></div></div>`:''}
 <div class="card"><h3>Thêm cả khu vực vào tuyến</h3><div class="acts">${[...new Set(S.stores.map(s=>s.area).filter(Boolean))].map(a=>`<button onclick="addArea('${esc(a)}')">${esc(a)}</button>`).join('')||'<span class="mut">Nhập “Khu vực/Tuyến” cho cửa hàng để dùng tính năng này.</span>'}</div></div>`}
function due_all(){dueStores().forEach(s=>{if(!SUB.route.includes(s.id))SUB.route.push(s.id)});toggleRoute('_')}
function addArea(a){S.stores.filter(s=>s.area===a&&s.status!=='tc').forEach(s=>{if(!SUB.route.includes(s.id))SUB.route.push(s.id)});toggleRoute('_')}
function mvRoute(i,d){const r=SUB.route.filter(id=>S.stores.find(s=>s.id===id));const j=i+d;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]];SUB.route=r;toggleRoute('_')}
function optimizeRoute(){getPos().then(p=>{let cur=p,left=SUB.route.map(id=>S.stores.find(s=>s.id===id)).filter(Boolean),out=[],nop=left.filter(s=>s.lat==null||s.lat==='');left=left.filter(s=>s.lat!=null&&s.lat!=='');
 while(left.length){left.sort((a,b)=>dist(cur,a)-dist(cur,b));const n=left.shift();out.push(n);cur=n}
 SUB.route=out.concat(nop).map(s=>s.id);toggleRoute('_');toast('Đã sắp xếp theo đường gần nhất')}).catch(e=>toast(e))}
function openRoute(){const r=SUB.route.map(id=>S.stores.find(s=>s.id===id)).filter(Boolean);if(!r.length)return toast('Tuyến trống');
 const chunk=r.slice(0,10),dest=chunk[chunk.length-1],wp=chunk.slice(0,-1).map(locStr).join('|');
 let u=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(locStr(dest))}&travelmode=driving`;if(wp)u+='&waypoints='+encodeURIComponent(wp);
 if(r.length>10)toast('Google Maps tối đa 10 điểm – đã mở 10 điểm đầu');window.open(u,'_blank')}
function vVisits(){const v=S.visits.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,80);
 const R={buy:'🛒 Đặt hàng',int:'🤔 Quan tâm, hẹn lại',no:'❌ Chưa có nhu cầu',away:'🚪 Chủ vắng'};
 return `<div class="card">${v.length?v.map(x=>`<div class="item"><div class="row"><b class="grow">${esc(storeName(x.storeId))}</b><span class="mut">${dmy(x.date)}</span></div><div>${R[x.result]||''} ${x.next?`<span class="tag y">Hẹn ${dmy(x.next)}</span>`:''}</div>${x.note?`<div class="mut">${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="empty">Chưa có lượt ghé.</div>'}</div>`}
function editStore(id){const s=id?S.stores.find(x=>x.id===id):{status:'tn',type:'Tạp hóa'};const areas=[...new Set(S.stores.map(s=>s.area).filter(Boolean).concat(['TP Vinh','Cửa Lò','Nghi Lộc','Hưng Nguyên','Nam Đàn','Diễn Châu','Quỳnh Lưu','Yên Thành','Đô Lương','Thanh Chương','Hoàng Mai','Thái Hòa']))];
 openModal(id?'Sửa cửa hàng':'Thêm cửa hàng',`<div class="card">
 <label>Tên cửa hàng *</label><input id="f_name" value="${esc(s.name||'')}" placeholder="VD: Tạp hóa Cô Lan">
 <div class="g2"><div><label>Chủ cửa hàng</label><input id="f_owner" value="${esc(s.owner||'')}"></div><div><label>Số điện thoại / Zalo</label><input id="f_phone" type="tel" value="${esc(s.phone||'')}"></div></div>
 <label>Địa chỉ</label><input id="f_address" value="${esc(s.address||'')}" placeholder="Số nhà, đường, xã/phường">
 <div class="g2"><div><label>Loại khách</label><select id="f_type">${STORE_TYPES.map(t=>`<option ${t===s.type?'selected':''}>${t}</option>`).join('')}</select></div>
 <div><label>Khu vực / Tuyến</label><input id="f_area" list="dl_area" value="${esc(s.area||'')}"><datalist id="dl_area">${areas.map(a=>`<option value="${esc(a)}">`).join('')}</datalist></div></div>
 <div class="g2"><div><label>Trạng thái</label><select id="f_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===s.status?'selected':''}>${v[0]}</option>`).join('')}</select></div>
 <div><label>Hẹn ghé lại</label><input id="f_next" type="date" value="${s.nextVisit||''}"></div></div>
 </div><div class="card"><h3>📍 Vị trí Google Maps</h3>
 <button class="btn b" onclick="pinHere()" style="width:100%">📍 Ghim vị trí tôi đang đứng (GPS)</button>
 <label>Hoặc dán link Google Maps / tọa độ</label><input id="f_map" value="${esc(s.mapUrl||'')}" placeholder="https://maps.app.goo.gl/... hoặc 18.67,105.68" oninput="const c=parseMapLink(this.value);if(c){f_lat.value=c.lat;f_lng.value=c.lng}">
 <div class="g2"><div><label>Vĩ độ (lat)</label><input id="f_lat" value="${s.lat??''}"></div><div><label>Kinh độ (lng)</label><input id="f_lng" value="${s.lng??''}"></div></div>
 <p class="mut" style="margin-top:6px">Mẹo: đứng tại cửa hàng bấm Ghim GPS là chính xác nhất. Link rút gọn maps.app.goo.gl vẫn dùng được để chỉ đường.</p></div>
 <div class="card"><label>Ghi chú (hàng đang bán, hãng đối thủ, sở thích chủ quán...)</label><textarea id="f_notes" rows="3">${esc(s.notes||'')}</textarea></div>
 ${id?`<div class="card"><h3>Lịch sử mua</h3>${storeOrders(id)}</div>`:''}`,
 `<div class="row"><button class="btn grow" onclick="saveStore('${id||''}')">💾 Lưu cửa hàng</button>${id?`<button class="btn r" onclick="delStore('${id}')">Xóa</button>`:''}</div>`)}
function pinHere(){toast('Đang lấy GPS...');getPos().then(p=>{$('f_lat').value=p.lat.toFixed(6);$('f_lng').value=p.lng.toFixed(6);toast('✅ Đã ghim vị trí')}).catch(e=>toast(e))}
function saveStore(id){const v=k=>$('f_'+k).value.trim();if(!v('name'))return toast('Nhập tên cửa hàng');
 const d={name:v('name'),owner:v('owner'),phone:v('phone'),address:v('address'),type:v('type'),area:v('area'),status:v('status'),nextVisit:v('next'),mapUrl:v('map'),lat:v('lat')===''?null:+v('lat'),lng:v('lng')===''?null:+v('lng'),notes:v('notes')};
 if(id)Object.assign(S.stores.find(x=>x.id===id),d);else S.stores.push(Object.assign({id:uid(),created:today()},d));save();toast('Đã lưu');closeModal()}
function delStore(id){if(!confirm('Xóa cửa hàng này? (đơn hàng cũ vẫn giữ)'))return;S.stores=S.stores.filter(s=>s.id!==id);save();closeModal()}
function storeOrders(id){const os=S.orders.filter(o=>o.storeId===id).sort((a,b)=>b.date<a.date?-1:1);if(!os.length)return'<div class="mut">Chưa có đơn.</div>';
 return os.map(o=>{const c=orderCalc(o);return `<div class="item row"><span class="grow">${dmy(o.date)} · ${o.items.length} mã</span><b>${fmt(c.rev)}</b></div>`}).join('')}
function visit(id){const s=S.stores.find(x=>x.id===id);
 openModal('Ghé thăm: '+esc(s.name),`<div class="card"><label>Kết quả</label><select id="v_res"><option value="buy">🛒 Đặt hàng</option><option value="int">🤔 Quan tâm, hẹn lại</option><option value="no">❌ Chưa có nhu cầu</option><option value="away">🚪 Chủ vắng</option></select>
 <label>Hẹn ghé lại</label><input type="date" id="v_next" value="${addDays(today(),+S.settings.cycle||10)}">
 <label>Ghi chú (lý do, đối thủ, SP chủ quan tâm...)</label><textarea id="v_note" rows="3"></textarea>
 <p class="mut" style="margin-top:8px">💡 Chưa có vị trí? ${s.lat==null||s.lat===''?'<button class="btn s b" onclick="getPos().then(p=>{const st=S.stores.find(x=>x.id===\''+id+'\');st.lat=+p.lat.toFixed(6);st.lng=+p.lng.toFixed(6);save();toast(\'Đã ghim vị trí\')}).catch(e=>toast(e))">📍 Ghim GPS ngay</button>':'Đã có.'}</p></div>`,
 `<button class="btn" style="width:100%" onclick="saveVisit('${id}')">💾 Lưu lượt ghé</button>`)}
function saveVisit(id){const r=$('v_res').value,n=$('v_next').value,s=S.stores.find(x=>x.id===id);
 S.visits.push({id:uid(),storeId:id,date:today(),result:r,next:n,note:$('v_note').value.trim()});s.nextVisit=n;
 if(r==='int'&&(s.status==='tn'))s.status='qt';if(r==='no'&&s.status==='tn')s.status='tn';save();
 if(r==='buy'){$('modal').classList.remove('on');newOrder(id)}else{toast('Đã lưu');closeModal()}}
</script>
<script>
/* ================== BÁN HÀNG / ĐƠN ================== */
let ORD=null;
function vSales(){SUB.sv=SUB.sv||'orders';const m=SUB.m||month();
 const tabs=`<div class="tabs"><button class="${SUB.sv==='orders'?'on':''}" onclick="SUB.sv='orders';render()">Đơn hàng</button><button class="${SUB.sv==='debt'?'on':''}" onclick="SUB.sv='debt';render()">Công nợ</button></div>`;
 if(SUB.sv==='debt'){const rows=S.orders.map(o=>({o,d:orderCalc(o).rev-(o.paid||0)})).filter(x=>x.d>0.5).sort((a,b)=>a.o.date<b.o.date?-1:1);
  return $('app').innerHTML=tabs+`<div class="card"><h3>Tổng nợ: <span class="neg">${fmt(rows.reduce((a,x)=>a+x.d,0))}</span></h3>${rows.length?rows.map(x=>`<div class="item row"><div class="grow"><b>${esc(storeName(x.o.storeId)||x.o.cust)}</b><div class="mut">${dmy(x.o.date)} · đơn ${fmt(orderCalc(x.o).rev)}</div></div><b class="neg">${fmt(x.d)}</b><button class="btn s" onclick="payDebt('${x.o.id}')">Thu</button></div>`).join(''):'<div class="empty">Không có công nợ 🎉</div>'}</div>`}
 const os=S.orders.filter(o=>o.date.slice(0,7)===m).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);let rv=0,pf=0;os.forEach(o=>{const c=orderCalc(o);rv+=c.rev;pf+=c.profit});
 $('app').innerHTML=tabs+`<div class="card"><div class="row"><input type="month" value="${m}" onchange="SUB.m=this.value;render()" style="flex:1"><button class="btn" onclick="newOrder()">＋ Tạo đơn</button></div>
 <div class="row" style="margin-top:8px"><span class="tag b">${os.length} đơn</span><span class="tag">DS ${fm(rv)}</span><span class="tag ${pf>=0?'':'r'}">Lãi ${fm(pf)} (${rv?(pf/rv*100).toFixed(1):0}%)</span></div></div>
 <div class="card">${os.length?os.map(o=>{const c=orderCalc(o),dt=c.rev-(o.paid||0);return `<div class="item"><div class="row"><b class="grow">${esc(o.storeId?storeName(o.storeId):(o.cust||'Khách lẻ'))}</b><b>${fmt(c.rev)}</b></div>
 <div class="mut">${dmy(o.date)} · ${o.items.map(it=>esc(PM[it.code]?.name||it.code)+' ×'+it.qty).join(', ')}</div>
 <div><span class="tag ${c.profit>=0?'':'r'}">Lãi ${fmt(c.profit)}</span>${dt>0.5?`<span class="tag r">Nợ ${fmt(dt)}</span>`:'<span class="tag b">Đã thu đủ</span>'}</div>
 <div class="acts"><button onclick="shareOrder('${o.id}')">📤 Gửi Zalo</button><button onclick="editOrder('${o.id}')">✏️ Sửa</button>${dt>0.5?`<button onclick="payDebt('${o.id}')">💵 Thu tiền</button>`:''}</div></div>`}).join(''):'<div class="empty">Chưa có đơn trong tháng.</div>'}</div>`}
function payDebt(id){const o=S.orders.find(x=>x.id===id),d=orderCalc(o).rev-(o.paid||0);const v=prompt('Số tiền thu (còn nợ '+fmt(d)+'):',Math.round(d));if(v==null)return;o.paid=(o.paid||0)+(+String(v).replace(/\D/g,'')||0);save();toast('Đã ghi thu');render()}
function newOrder(storeId){ORD={id:null,date:today(),storeId:storeId||'',cust:'',items:[],paid:null,note:''};orderForm()}
function editOrder(id){ORD=JSON.parse(JSON.stringify(S.orders.find(o=>o.id===id)));orderForm()}
function isLe(){const s=S.stores.find(x=>x.id===ORD.storeId);return !ORD.storeId||(s&&s.type==='Khách lẻ')}
function orderForm(){const sm=stockMap();
 openModal(ORD.id?'Sửa đơn':'Đơn bán mới',`<div class="card"><div class="g2"><div><label>Ngày</label><input type="date" value="${ORD.date}" onchange="ORD.date=this.value"></div>
 <div><label>Khách hàng</label><select onchange="ORD.storeId=this.value;orderForm()"><option value="">— Khách lẻ —</option>${S.stores.map(s=>`<option value="${s.id}" ${s.id===ORD.storeId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div>
 ${!ORD.storeId?`<label>Tên khách lẻ / SĐT</label><input value="${esc(ORD.cust||'')}" oninput="ORD.cust=this.value">`:''}
 <p class="mut" style="margin-top:6px">Bảng giá áp dụng: <b>${isLe()?'Giá lẻ (khách lẻ)':'Giá sỉ cửa hàng'}</b></p></div>
 <div class="card"><button class="btn big" onclick="openPicker(addLine)">🔍 Tìm & thêm sản phẩm</button><div class="acts"><button onclick="openPicker(addLine,{cat:\'focus\'})">⭐ Mã trọng tâm</button><button onclick="openPicker(addLine,{cat:\'rc\'})">🍽️ Rửa chén</button><button onclick="openPicker(addLine,{cat:\'giat\'})">👕 Giặt xả</button><button onclick="openPicker(addLine,{cat:\'ls\'})">🧹 Lau sàn</button></div></div>
 <div id="lines">${ORD.items.map((it,i)=>lineHtml(it,i,sm)).join('')||'<div class="empty">Chưa có sản phẩm</div>'}</div>
 <div class="card"><label>Khách đã trả (để trống = trả đủ)</label><input inputmode="numeric" id="o_paid" value="${ORD.paid??''}" placeholder="Trả đủ">
 <label>Ghi chú đơn</label><input id="o_note" value="${esc(ORD.note||'')}"></div>`,
 `<div id="ofoot"></div>`);updFoot()}
function lineHtml(it,i,sm){const p=PM[it.code]||{name:it.code,unit:'',pack:1};const r=it.qty*it.price*(1-(it.disc||0)/100);let c=it.qty*it.cost;(it.gifts||[]).forEach(g=>c+=g.qty*g.cost);
 const pf=r-c,pct=r?pf/r*100:0;
 return `<div class="line"><div class="row"><b class="grow">${esc(p.name)}</b><button class="btn gr s" onclick="ORD.items.splice(${i},1);orderForm()">✕</button></div>
 <div class="mut">Tồn: <span class="${sm[it.code]>0?'stockok':'stock0'}">${fmt(sm[it.code]||0)}</span> · KM cty: ${esc(promoText(p))}</div>
 <div class="g3"><div><label>SL (${p.unit}) <a href="#" onclick="event.preventDefault();ORD.items[${i}].qty+=${p.pack};orderForm()">+1 thùng</a></label><input inputmode="numeric" value="${it.qty}" onchange="ORD.items[${i}].qty=+this.value||0;orderForm()"></div>
 <div><label>Đơn giá</label><input inputmode="numeric" value="${it.price}" onchange="ORD.items[${i}].price=+this.value||0;orderForm()"></div>
 <div><label>CK %</label><input inputmode="decimal" value="${it.disc||0}" onchange="ORD.items[${i}].disc=+this.value||0;orderForm()"></div></div>
 <div style="margin-top:6px">🎁 Quà: ${(it.gifts||[]).length?it.gifts.map((g,j)=>`<span class="tag y">${g.qty} ${esc(PM[g.code]?.name||g.code)} <a href="#" onclick="event.preventDefault();ORD.items[${i}].gifts.splice(${j},1);orderForm()">✕</a></span>`).join(''):'<span class="mut">không</span>'}</div>
 <div class="acts"><button onclick="applyPromo(${i},'co')">KM công ty</button><button onclick="applyPromo(${i},'opt')">⚡ Tặng tối ưu (giữ lãi ${S.settings.margin}%)</button><button onclick="giftOther(${i})">＋ Quà khác</button></div>
 <div class="row" style="margin-top:6px"><span class="grow mut">Thành tiền <b style="color:#222">${fmt(r)}</b></span><span class="${pf>=0?'pos':'neg'}">Lãi ${fmt(pf)} (${pct.toFixed(1)}%)</span></div></div>`}
function addLine(v){const code=String(v).split(' | ')[0].trim();const p=PM[code];if(!p){return}
 ORD.items.push({code,qty:p.buy<=p.pack?p.pack:p.buy,price:isLe()?priceLe(p):price(p),cost:cost(p),disc:0,gifts:[]});orderForm()}
function applyPromo(i,mode){const it=ORD.items[i],p=PM[it.code],g=PM[p.gift]||p;
 if(mode==='co'){const n=Math.floor(it.qty/p.buy)*p.giftQty;it.gifts=n?[{code:g.code,qty:n,cost:cost(g)}]:[];if(!n)toast(`Chưa đủ ${p.buy} ${p.unit} để nhận KM`)}
 else{const r=it.qty*it.price*(1-(it.disc||0)/100),budget=r-it.qty*it.cost-S.settings.margin/100*r,k=Math.max(0,Math.floor(budget/cost(g)));it.gifts=k?[{code:g.code,qty:k,cost:cost(g)}]:[];toast(k?`Tặng được tối đa ${k} ${g.unit}`:'Không đủ lãi để tặng thêm')}
 orderForm()}
function giftOther(i){openPicker(code=>{const q=+prompt('Số lượng tặng:',1)||0;if(q>0){ORD.items[i].gifts=ORD.items[i].gifts||[];ORD.items[i].gifts.push({code,qty:q,cost:cost(PM[code])})}orderForm()},{cat:'gift'})}
function openGiftPick(cb){window._gcb=cb;const html=`<div class="card"><input list="dl_g" placeholder="Chọn sản phẩm làm quà" onchange="const c=this.value.split(' | ')[0];if(PM[c])_gcb(c)"><datalist id="dl_g">${PRODUCTS.map(p=>`<option value="${p.code} | ${esc(p.name)}">`).join('')}</datalist>
 <h3 style="margin-top:10px">Quà gợi ý (giá vốn thấp, dễ dùng)</h3>${GIFT_CANDIDATES.map(c=>PM[c]).filter(Boolean).map(p=>`<div class="item row"><span class="grow">${esc(p.name)}<div class="mut">vốn ${fmt(cost(p))} · khách thấy giá ${fmt(price(p))}</div></span><button class="btn s" onclick="_gcb('${p.code}')">Chọn</button></div>`).join('')}</div>`;
 $('mbox').insertAdjacentHTML('beforeend',`<div id="gpick" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:flex-end"><div style="background:var(--bg);width:100%;max-height:80vh;overflow:auto;padding:14px;border-radius:16px 16px 0 0"><div class="row"><b class="grow">Chọn quà tặng</b><button class="btn gr s" onclick="$('gpick').remove()">✕</button></div>${html}</div></div>`)}
function updFoot(){const c=orderCalc(ORD);$('ofoot').innerHTML=`<div class="row"><div class="grow"><b>Tổng: ${fmt(c.rev)}</b><div class="mut">Lãi <span class="${c.profit>=0?'pos':'neg'}">${fmt(c.profit)}</span> (${c.rev?(c.profit/c.rev*100).toFixed(1):0}%)</div></div>${ORD.id?`<button class="btn r s" onclick="delOrder()">Xóa</button>`:''}<button class="btn" onclick="saveOrder()">💾 Lưu đơn</button></div>`}
function saveOrder(){if(!ORD.items.length)return toast('Chưa có sản phẩm');const pv=$('o_paid').value.replace(/\D/g,'');const c=orderCalc(ORD);
 ORD.paid=pv===''?c.rev:+pv;ORD.note=$('o_note').value;const sm=stockMap();
 const short=ORD.items.filter(it=>!ORD.id&&(sm[it.code]||0)<it.qty);if(short.length&&!confirm('Tồn kho không đủ: '+short.map(it=>PM[it.code].name).join(', ')+'. Vẫn lưu?'))return;
 if(ORD.id){const i=S.orders.findIndex(o=>o.id===ORD.id);S.orders[i]=ORD}else{ORD.id=uid();S.orders.push(ORD)}
 const s=S.stores.find(x=>x.id===ORD.storeId);if(s){if(s.status==='tn'||s.status==='qt'||s.status==='tc')s.status='mua';else if(s.status==='mua'&&S.orders.filter(o=>o.storeId===s.id).length>=3)s.status='quen';s.nextVisit=addDays(ORD.date,+S.settings.cycle||10)}
 save();toast('✅ Đã lưu đơn');const id=ORD.id;closeModal();if(confirm('Gửi phiếu đơn cho khách qua Zalo/tin nhắn?'))shareOrder(id)}
function delOrder(){if(!confirm('Xóa đơn này? Tồn kho sẽ được hoàn lại.'))return;S.orders=S.orders.filter(o=>o.id!==ORD.id);save();closeModal()}
function shareOrder(id){const o=S.orders.find(x=>x.id===id),c=orderCalc(o);
 let t=`🧾 PHIẾU GIAO HÀNG – ${dmy(o.date)}\nKhách: ${o.storeId?storeName(o.storeId):(o.cust||'Khách lẻ')}\n`;
 o.items.forEach(it=>{const p=PM[it.code];t+=`• ${p?p.name:it.code}: ${it.qty} ${p?p.unit:''} × ${fmt(it.price)}${it.disc?` (CK ${it.disc}%)`:''} = ${fmt(it.qty*it.price*(1-(it.disc||0)/100))}\n`;(it.gifts||[]).forEach(g=>t+=`   🎁 Tặng ${g.qty} ${PM[g.code]?.name||g.code}\n`)});
 t+=`TỔNG: ${fmt(c.rev)}đ\nĐã trả: ${fmt(o.paid)}đ${c.rev-o.paid>0.5?`\nCòn nợ: ${fmt(c.rev-o.paid)}đ`:''}\n${S.settings.seller?'NVBH: '+S.settings.seller:''}\nCảm ơn anh/chị đã ủng hộ! 🙏`;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã chép phiếu – dán vào Zalo')).catch(()=>prompt('Chép nội dung phiếu:',t))}}

/* ================== KHO ================== */
function editProd(code){const p=PM[code],s=stockMap()[code]||0;
 openModal(esc(p.name),`<div class="card"><div class="row">${thumb(p,true)}<div class="grow"><b>${esc(p.name)}</b><div>${isFocus(code)?'<span class="tag y">⭐ Trọng tâm</span>':''}<span class="tag gr">${esc(p.group)}</span></div></div></div></div><div class="card"><table>
 <tr><td>Mã / Nhãn</td><td class="r">${p.code} · ${p.brand}</td></tr><tr><td>Quy cách thùng</td><td class="r">${p.pack} ${p.unit.toLowerCase()}</td></tr>

 <div class="card"><label><input type="checkbox" style="width:auto" ${IMP.upd?'checked':''} onchange="IMP.upd=this.checked"> Cập nhật giá vốn sản phẩm theo phiếu này</label></div>`,

 if(IMP.upd)IMP.items.forEach(it=>{if(it.qty)setProd(it.code,'cost',Math.round(it.qty*it.price/(it.qty+it.free)))});save();toast('✅ Đã nhập kho');closeModal()}

<script>
/* ================== TÍNH KHUYẾN MÃI THÔNG MINH ================== */
function vPromo(){const p=PM[SUB.pc]||PM['13630'];SUB.pc=p.code;
 const qty=SUB.pq??(p.buy),pr=SUB.pp??price(p),c=SUB.pco??cost(p),t=SUB.pt??S.settings.margin;
 $('app').innerHTML=`<div class="card"><h3>🎁 Phòng thí nghiệm khuyến mãi</h3><p class="mut">Chọn sản phẩm & số lượng khách định lấy → app tính các phương án: khách thấy được lợi nhiều nhất, bạn vẫn giữ lãi mục tiêu.</p>
 <div class="pc" onclick="openPicker(c=>{SUB.pc=c;SUB.pq=SUB.pp=SUB.pco=undefined;render()})">${thumb(p)}<div class="grow"><b>${esc(p.name)}</b><div class="mut">${p.code} · bấm để đổi sản phẩm 🔍</div></div></div>
 <div class="g2"><div><label>Số lượng (${p.unit}) · thùng ${p.pack}</label><input inputmode="numeric" value="${qty}" onchange="SUB.pq=+this.value||1;render()"></div><div><label>Giá bán/đv</label><input inputmode="numeric" value="${pr}" onchange="SUB.pp=+this.value||0;render()"></div>
 <div><label>Giá vốn/đv</label><input inputmode="numeric" value="${c}" onchange="SUB.pco=+this.value||0;render()"></div><div><label>Lãi tối thiểu muốn giữ (%)</label><input inputmode="decimal" value="${t}" onchange="SUB.pt=+this.value||0;render()"></div></div>
 <p class="mut" style="margin-top:6px">KM công ty: ${esc(promoText(p))} · giá chia ${fmt(netOf(p))}</p></div>
 ${promoOptions(p,qty,pr,c,t)}
 <div class="card"><h3>📶 Gợi ý bậc thang (mua nhiều – tặng nhiều hơn)</h3>${ladder(p,pr,c,t)}<p class="mut" style="margin-top:6px">Bậc thang giúp khách tự “nâng đơn” để lên mốc quà tiếp theo → tăng doanh số mà vẫn giữ lãi.</p></div>`}
function opt(title,desc,qty,pr,c,gifts,disc){const R=qty*pr*(1-(disc||0)/100);let GC=0,GV=0,GN=0;gifts.forEach(g=>{GC+=g.qty*cost(g.p);GV+=g.qty*price(g.p);if(g.p.code===SUB.pc)GN+=g.qty});
 const pf=R-qty*c-GC,units=qty+GN;return{title,desc,R,GC,GV,pf,pct:R?pf/R*100:0,unit:R/units,save:(qty*pr-R)+GV}}
function promoOptions(p,qty,pr,c,t){const g=PM[p.gift]||p,out=[],T=t/100;
 out.push(opt('Không khuyến mãi','Bán đúng giá, không tặng',qty,pr,c,[]));
 const nco=Math.floor(qty/p.buy)*p.giftQty;if(nco)out.push(opt('KM đầy đủ như công ty',`Tặng ${nco} ${g.unit.toLowerCase()} ${g.name}`,qty,pr,c,[{p:g,qty:nco}]));
 const budget=qty*pr*(1-T)-qty*c;const k=Math.max(0,Math.floor(budget/cost(g)));if(k)out.push(opt(`⚡ Tặng tối ưu (giữ lãi ≥ ${t}%)`,`Tặng ${k} ${g.unit.toLowerCase()} ${g.name}`,qty,pr,c,[{p:g,qty:k}]));
 const d=Math.max(0,(1-qty*c/(qty*pr*(1-T)))*100);if(d>0.1)out.push(opt('Chiết khấu thẳng tương đương',`Giảm ${d.toFixed(1)}% trên hóa đơn`,qty,pr,c,[],Math.floor(d*10)/10));
 GIFT_CANDIDATES.map(x=>PM[x]).filter(x=>x&&x.code!==p.code).forEach(x=>{const n=Math.floor(budget/cost(x));if(n>0)out.push(opt('Tặng SP khác (mồi dùng thử)',`Tặng ${n} ${x.unit.toLowerCase()} ${x.name}`,qty,pr,c,[{p:x,qty:n}]))});
 const safe=out.filter(o=>o.pct>=t-0.01);const best=safe.slice().sort((a,b)=>b.GV+ (b.R<qty*pr?qty*pr-b.R:0) -(a.GV+(a.R<qty*pr?qty*pr-a.R:0)))[0];
 return `<div class="card"><h3>Các phương án cho ${qty} ${p.unit.toLowerCase()}</h3>${out.map(o=>`<div class="opt ${o===best?'best':''}"><div class="h"><span>${o===best?'⭐ ':''}${o.title}</span><span class="${o.pf>=0?'pos':'neg'}">${o.pct.toFixed(1)}%</span></div><div class="mut">${esc(o.desc)}</div>
 <div class="nums"><div>Khách trả<b>${fmt(o.R)}</b></div><div>Khách thấy được lợi<b>${fmt(o.save)}</b></div><div>Bạn lãi<b class="${o.pf>=0?'pos':'neg'}">${fmt(o.pf)}</b></div><div>Giá chia/đv<b>${fmt(o.unit)}</b></div><div>Chi phí quà thật<b>${fmt(o.GC)}</b></div><div>Quà theo giá bán<b>${fmt(o.GV)}</b></div></div></div>`).join('')}
 <p class="mut">⭐ = phương án khách thấy lợi nhiều nhất mà bạn vẫn giữ lãi ≥ ${t}%. “Khách thấy được lợi” tính quà theo giá bán — đây là con số nên nói với chủ cửa hàng.</p></div>`}
function ladder(p,pr,c,t){const g=PM[p.gift]||p;const steps=[[1,t+4],[2,t+2],[3,t],[5,Math.max(3,t-2)]];
 return `<table><tr><th>Mua</th><th>Tặng</th><th class="r">Lãi</th></tr>${steps.map(([n,m])=>{const q=n*p.pack,R=q*pr,k=Math.max(0,Math.floor((R*(1-m/100)-q*c)/cost(g))),pf=R-q*c-k*cost(g);
 return `<tr><td>${n} thùng (${q})</td><td>${k?k+' '+esc(g.unit.toLowerCase()+' '+(g.code===p.code?'cùng loại':g.name)):'—'}</td><td class="r ${pf>=0?'pos':'neg'}">${fmt(pf)} (${R?(pf/R*100).toFixed(1):0}%)</td></tr>`}).join('')}</table>`}

/* ================== TƯ VẤN ================== */
function quickPitch(p){const b={SWAT:`<p><b>SWAT – “Nhanh · Gọn · Sạch”</b>, CLEAN Power siêu sạch – siêu tiết kiệm, sản xuất tại nhà máy đạt chuẩn châu Âu (chứng nhận ISO – BSI).</p>`,
 Solhome:`<p><b>Solhome – phong cách Nhật (日本風)</b>, công nghệ MISINO cuốn sạch, hương hoa Nhật: Đào Sakura, Trà Tsubaki, Tử Đằng Fuji; lưu hương 72h (giặt xả). Rửa chén hương thiên nhiên: Chanh Yuzu, Gạo Kome, Trà Matcha.</p>`,
 Grasse:`<p><b>Grasse – dầu gội/xả/sữa tắm nước hoa</b>, bao bì sang, hợp salon, spa, tạp hóa khu dân cư trẻ. (NVBH được thưởng 80.000đ/thùng Grasse.)</p>`}[p.brand]||'';
 const g={'Lau sàn':'Sạch bóng kin kít, không nhờn rít, khử mùi 24h. Can lớn tiết kiệm ~100.000đ so với mua chai 960ml – nói ngay với quán ăn, khách sạn.','Rửa chén':'X3: khử tanh, sạch nhanh dầu mỡ, đậm đặc. Can lớn tiết kiệm ~165.000đ so với chai 400g – “món” chủ lực cho quán ăn, nhà hàng.','Giặt xả SWAT':'5in1 giặt + xả trong 1, tiết kiệm thời gian; dòng phơi trong nhà hợp mùa mưa nồm miền Trung.','Giặt xả Solhome':'Hàng MỚI – thơm kiểu Nhật, lưu hương lâu; gợi ý chủ tiệm mở 1 thùng thử, bóc 1 túi cho khách ngửi.'}[p.group]||'';
 return b+(g?`<p>✅ ${g}</p>`:'')+`<div class="say">“Chị ơi, bên em đang có ${esc(promoText(p))}, tính ra mỗi ${p.unit.toLowerCase()} chị nhập chỉ còn khoảng ${fmt(netOf(p))}, bán giá ${fmt(p.retail)} là chị có lời ngay.”</div>`}
function vGuide(){$('app').innerHTML=`
<details open><summary>🧭 Chiến lược bán thông minh (đọc trước khi đi tuyến)</summary><div class="in">
<p><b>1. Đừng “xả” hết KM công ty.</b> NPP đang để giá bán thẳng (giá chia sau KM). Hãy dùng tab <b>🎁 Tính KM</b> để giữ lại 1 phần làm lãi, phần còn lại biến thành quà “tặng thêm” khách nhìn thấy rõ.</p>
<p><b>2. Chia SP làm 3 vai:</b></p><ul><li><b>SP mồi (mở cửa):</b> Rửa chén 400g, Javel 500ml, Lau kính 580ml – giá thấp, dễ bán, lấy đơn đầu tiên.</li><li><b>SP chủ lực (doanh số):</b> Giặt xả SWAT túi 3.5kg/can 3.8kg, lau sàn & rửa chén can lớn cho quán ăn.</li><li><b>SP lãi/thưởng:</b> Grasse (+80k/thùng), Solhome mới (khác biệt, ít cạnh tranh giá).</li></ul>
<p><b>3. Tặng quà là SP khác</b> (dây xả vải, rửa chén 400g, dây dầu gội Grasse): giá vốn thấp nhưng khách thấy giá trị cao, lại giúp chủ tiệm dùng thử SP mới → đơn sau lấy thêm.</p>

<p><b>7. Đi theo cụm:</b> mỗi ngày 1 khu vực, 20–30 điểm, dùng “Lộ trình hôm nay → Tối ưu thứ tự”.</p>

<p>👉 Luôn bấm <b>✅ Ghé thăm</b> ghi kết quả + ngày hẹn để app nhắc.</p></div></details>

<p><b>“Chủ đi vắng.”</b> → xin SĐT/Zalo chủ, để lại tờ giá, ghi “Chủ vắng” + hẹn ngày.</p></div></details>

<p><b>🏪 Tạp hóa:</b> mix nhiều mã nhỏ (rửa chén 400g/750g, lau sàn 960ml, giặt xả túi 2.2kg, dây xả vải 20ml, Javel). Nhấn mạnh <i>vòng quay nhanh + lãi/chai</i>.</p>
<p><b>🍜 Quán ăn / Nhà hàng:</b> rửa chén can 4kg/9kg (khử tanh, sạch dầu mỡ), lau sàn can 3.6–4kg, Javel can, thông cống. Nhấn mạnh <i>tiết kiệm 100–165k so với chai nhỏ</i>, em giao tận nơi định kỳ.</p>
<p><b>🏨 Khách sạn / Nhà nghỉ:</b> giặt xả can 3.8–5kg/9kg, lau sàn hương Sweet Lily, lau kính, tẩy rửa nhà tắm can 4kg, dây dầu gội & sữa tắm Grasse 5.8ml cho phòng.</p>
<p><b>👕 Tiệm giặt là:</b> giặt xả can lớn, nước giặt cửa trước, tẩy lồng giặt, xả vải 3 lít; Solhome lưu hương cho khách khó tính.</p>
<p><b>💇 Salon / Spa:</b> Grasse (dầu gội, dầu xả, kem ủ, tinh chất dưỡng tóc) – bộ đôi 620ml + 215ml.</p>
<p><b>🏫 Trường / Mầm non:</b> lau sàn Baby 4kg, giặt xả cho bé Organic 2kg, rửa chén can.</p>
<p><b>🙋 Khách lẻ:</b> dùng giá lẻ; gợi ý combo gia đình (giặt xả + rửa chén + lau sàn) tặng 1 dây xả vải.</p></div></details>
<details><summary>🆕 Giới thiệu sản phẩm mới Solhome</summary><div class="in">
<p><b>Nước giặt xả hương hoa Solhome 日本風</b> – túi 3kg & can 3.5kg, 3 hương: Đào Sakura, Trà Tsubaki, Tử Đằng Fuji. Công nghệ MISINO “cơn lốc sạch sâu bụi bẩn”, lưu hương 72h. Thông điệp: “5 sao chăm quần áo chuẩn Nhật”, “Giải pháp sạch sâu – lưu hương bền lâu”.</p>
<p><b>Nước rửa chén Solhome hương thiên nhiên</b> – chai 750g & can 2kg: Chanh Yuzu, Gạo Kome, Trà Matcha. MISINO cuốn sạch dầu mỡ. KM mạnh: can 2kg mua 24 tặng 11.</p>
<p><b>Nước tẩy Solhome:</b> tẩy vải màu 600ml, tẩy lồng máy giặt 550g, tẩy đường ống 800ml.</p>
<div class="say">“Chị ơi dòng này mới về Nghệ An, hương Nhật rất lạ – em để chị 1 thùng trưng bày, bóc 1 túi cho khách ngửi, bán được em ghé bổ sung.”</div>
<p class="mut">Chỉ nói đúng những gì in trên bao bì/tài liệu công ty, không hứa công dụng ngoài nhãn.</p></div></details>
<details><summary>💰 Chính sách lương thưởng NVBH (T08/2026)</summary><div class="in">
<p>Lương căn bản: bậc 1 ${fmt(BASE[1])} · bậc 2 ${fmt(BASE[2])} · bậc 3 ${fmt(BASE[3])} · bậc 4 ${fmt(BASE[4])}.</p>

/* ================== CÀI ĐẶT & SAO LƯU ================== */
function openSettings(){const s=S.settings;openModal('⚙️ Cài đặt & Sao lưu',`<div class="card" style="text-align:center"><img src="${LOGO_FULL}" alt="TVwin" style="max-width:200px;width:60%"><p class="mut">Ứng dụng bán hàng kênh GT · phát triển bởi <b>thangvo.win</b></p></div><div class="card">
 <div class="g2"><div><label>Tên bạn (NVBH)</label><input id="s_seller" value="${esc(s.seller)}"></div><div><label>Nhà phân phối</label><input id="s_npp" value="${esc(s.npp)}"></div></div>
 <div class="g2"><div><label>Chỉ tiêu doanh số tháng</label><select id="s_target">${BONUS.cols.map(c=>`<option value="${c}" ${+s.target===c?'selected':''}>${fmt(c)}</option>`).join('')}</select></div>
 <div><label>Bậc lương</label><select id="s_level">${[1,2,3,4].map(l=>`<option ${+s.level===l?'selected':''}>${l}</option>`).join('')}</select></div></div>
 <div class="g2"><div><label>Lãi tối thiểu mục tiêu (%)</label><input id="s_margin" inputmode="decimal" value="${s.margin}"></div><div><label>Chu kỳ ghé lại (ngày)</label><input id="s_cycle" inputmode="numeric" value="${s.cycle}"></div></div>
 <label>Giá vốn mặc định tính theo</label><select id="s_cb"><option value="net" ${s.costBasis==='net'?'selected':''}>Giá chia sau KM (NPP bán thẳng giá chia)</option><option value="nppnet" ${s.costBasis==='nppnet'?'selected':''}>Giá NPP chia sau KM (NPP chia lại toàn bộ KM)</option><option value="npp" ${s.costBasis==='npp'?'selected':''}>Giá bán cho NPP</option></select>
 <label>Địa chỉ máy chủ Trợ lý AI</label><input id="s_ai" value="${esc(s.aiUrl||'')}" placeholder="${AI_DEFAULT}">
 <label>Giá lẻ khách = giá công ty + (%)</label><input id="s_le" inputmode="decimal" value="${s.leMarkup}">
 <p class="mut" style="margin-top:6px">Giá vốn riêng từng SP (nhập tay hoặc từ phiếu nhập) luôn ưu tiên hơn cài đặt này.</p></div>
 <div class="card"><h3>💾 Sao lưu dữ liệu</h3><p class="mut">Dữ liệu lưu trên chính điện thoại này. Nên sao lưu mỗi tuần (gửi file vào Zalo “Cloud của tôi”).</p>
 <div class="acts"><button class="go" onclick="backup()">⬇️ Tải file sao lưu (.json)</button><button onclick="$('rf').click()">⬆️ Khôi phục từ file</button><button onclick="csv('stores')">📊 Xuất cửa hàng (Excel)</button><button onclick="csv('orders')">📊 Xuất đơn hàng (Excel)</button><button onclick="csv('stock')">📊 Xuất tồn kho (Excel)</button></div>
 <input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this.files[0])"></div>
 <div class="card"><button class="btn r s" onclick="if(confirm('Xóa TOÀN BỘ dữ liệu? Hãy sao lưu trước!')){localStorage.removeItem(KEY);location.reload()}">Xóa toàn bộ dữ liệu</button></div>`,
 `<button class="btn" style="width:100%" onclick="saveSettings()">💾 Lưu cài đặt</button>`)}
function saveSettings(){const v=id=>$(id).value;Object.assign(S.settings,{seller:v('s_seller'),npp:v('s_npp'),target:+v('s_target'),level:+v('s_level'),margin:+v('s_margin')||0,cycle:+v('s_cycle')||10,costBasis:v('s_cb'),leMarkup:+v('s_le')||0,aiUrl:v('s_ai').trim()});save();buildProducts();toast('Đã lưu');closeModal()}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('banhang-gt-'+today()+'.json',JSON.stringify(S),'application/json');toast('Đã tải file sao lưu')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;if(!confirm('Thay dữ liệu hiện tại bằng file này?'))return;localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch(e){toast('File không hợp lệ')}};r.readAsText(f)}
function csv(kind){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let rows=[];
 if(kind==='stores')rows=[['Tên','Chủ','SĐT','Địa chỉ','Loại','Khu vực','Trạng thái','Lat','Lng','Mua gần nhất','Công nợ','Ghi chú']].concat(S.stores.map(s=>[s.name,s.owner,s.phone,s.address,s.type,s.area,STATUS[s.status||'tn'][0],s.lat,s.lng,lastOrder(s.id),Math.round(debtOf(s.id)),s.notes]));
 if(kind==='orders'){rows=[['Ngày','Khách','Mã','Sản phẩm','SL','Đơn giá','CK%','Thành tiền','Quà tặng','Giá vốn dòng']];S.orders.forEach(o=>o.items.forEach(it=>rows.push([o.date,o.storeId?storeName(o.storeId):o.cust,it.code,PM[it.code]?.name,it.qty,it.price,it.disc||0,Math.round(it.qty*it.price*(1-(it.disc||0)/100)),(it.gifts||[]).map(g=>g.qty+' '+(PM[g.code]?.name||g.code)).join('; '),Math.round(it.qty*it.cost+(it.gifts||[]).reduce((a,g)=>a+g.qty*g.cost,0))])))}
 if(kind==='stock'){const sm=stockMap();rows=[['Mã','Sản phẩm','Nhãn','Tồn','Giá vốn','Giá sỉ','Giá lẻ','Giá trị tồn']].concat(PRODUCTS.map(p=>[p.code,p.name,p.brand,sm[p.code]||0,cost(p),price(p),priceLe(p),Math.round((sm[p.code]||0)*cost(p))]))}
 dl(kind+'-'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8')}

$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script>

const IMG_MAP={'13360-4':'swat_rc_sc','13353':'swat_rc_sc','13362-2':'swat_rc_sc','13117':'swat_ls_lily','13121-2':'swat_ls_lily','13107':'swat_ls_lily','13118':'swat_ls_sc','13124-2':'swat_ls_sc','13108':'swat_ls_sc','S13603':'sol_pink','S13600':'sol_bottle','S13605':'sol_red','S13602':'sol_red','S13604':'sol_purple','S13601':'sol_purple','S13320':'sol_yuzu','S13300':'sol_yuzu','S13321':'sol_kome','S13301':'sol_kome'};
const CATS=[['focus','⭐','Trọng tâm'],['rc','🍽️','Rửa chén/bát'],['giat','👕','Giặt xả'],['xa','🌸','Xả vải'],['ls','🧹','Lau sàn'],['tay','🚽','Tẩy rửa/WC'],['kinh','🪟','Lau kính/đa năng'],['grasse','💆','Gội/xả/sữa tắm'],['has','📦','Đang có hàng']];
function catOf(p){const g=p.group;if(/Rửa chén/.test(g))return'rc';if(/Giặt xả/.test(g))return'giat';if(/Xả vải/.test(g))return'xa';if(/Lau sàn/.test(g))return'ls';if(/Lau kính|đa năng/.test(g))return'kinh';if(g==='Grasse')return'grasse';return'tay'}
const ICON={rc:'🍽️',giat:'👕',xa:'🌸',ls:'🧹',tay:'🚽',kinh:'🪟',grasse:'💆'};
function thumb(p,l){const k=IMG_MAP[p.code];return k&&IMGS[k]?`<img class="th${l?' l':''}" src="${IMGS[k]}" alt="">`:`<div class="th${l?' l':''}">${ICON[catOf(p)]||'🧴'}</div>`}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9.]+/g,' ').trim();
const GKW={rc:'rua chen rua bat nuoc rua bat chen bat bat dia rua ly rua coc dau mo khu tanh bep',giat:'giat xa nuoc giat bot giat quan ao may giat giat do 5in1',xa:'xa vai nuoc xa thom quan ao mem vai',ls:'lau san lau nha nuoc lau nha lau gach thom nha',tay:'tay rua tay trang javen javel nha tam bon cau toilet wc ve sinh thong cong tac cong long may giat duong ong',kinh:'lau kinh lau guong cua kinh lau da nang lau bep',grasse:'dau goi dau xa sua tam toc nuoc hoa kem u duong toc salon spa'};
const STOP=new Set(['nuoc','loai','cho','cua','va','hang','sp','san','pham','mot','cai','con','co','khong','la','nhe','di','ban','em','anh','chi','mua']);
let KW={};
function buildKW(){KW={};PRODUCTS.forEach(p=>{const c=catOf(p);const m=p.name.match(/(\d+(?:\.\d+)?)\s*(kg|lit|lít|l|ml|g)\b/i);let big=/Can|Túi/.test(p.unit);if(m){const v=+m[1],u=m[2].toLowerCase();if(/kg|lit|lít|^l$/.test(u)&&v>=2)big=true;if(/ml|^g$/.test(u)||(/kg|lit|lít|^l$/.test(u)&&v<2))big=false}
 const size=big?'to lon can tui bich lon dai tiet kiem quan an nha hang khach san':'nho chai le be nho gon';
 const txt=[p.code,p.name,p.group,p.brand,GKW[c]||'',size,p.isNew?'moi':'',p.brand==='Solhome'?'nhat ban japan':'',isFocus(p.code)?'trong tam':''].join(' ');KW[p.code]=norm(txt).split(' ')})}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}
function tokW(t,kws){let w=0;for(const k of kws){if(k===t)return 1;if(t.length>=2&&k.startsWith(t)&&(k.length-t.length<=2||t.length>=4))w=Math.max(w,.85);else if(t.length>=4&&lev(t,k)<=1)w=Math.max(w,.7)}return w}
function tokHit(t,kws){return tokW(t,kws)>0}
function smartSearch(q,list){list=list||PRODUCTS;const toks=norm(q).split(' ').filter(t=>t&&!STOP.has(t));if(!toks.length)return list;
 const sc=list.map(p=>{const kw=KW[p.code]||[],nm=norm(p.name).split(' '),full=' '+kw.join(' ')+' ';let n=0,hits=0;toks.forEach((t,i)=>{const w=tokW(t,kw);if(w){hits++;n+=w;if(tokW(t,nm))n+=.3}if(i&&full.includes(' '+toks[i-1]+' '+t+' '))n+=.5});return{p,n:hits?n:0}}).filter(x=>x.n>0);if(!sc.length)return[];
 const best=Math.max(...sc.map(x=>x.n));return sc.filter(x=>x.n>=Math.max(1,best*0.75)).sort((a,b)=>b.n-a.n||(isFocus(b.p.code)-isFocus(a.p.code))).map(x=>x.p)}
/* Mã trọng tâm */
if(!S.focus)S.focus=RAW.filter(r=>NEW_GROUPS.includes(r[3])).map(r=>r[0]);
function isFocus(c){return S.focus.includes(c)}
function toggleFocus(c){const i=S.focus.indexOf(c);i<0?S.focus.push(c):S.focus.splice(i,1);save();buildKW()}
function hasFocus(id){return S.orders.some(o=>o.storeId===id&&o.items.some(it=>isFocus(it.code)))}
function focusCard(){const st=S.stores.filter(s=>s.type!=='Khách lẻ'&&s.status!=='tc');const got=st.filter(s=>hasFocus(s.id));const pct=st.length?got.length/st.length*100:0;
 const miss=st.filter(s=>!hasFocus(s.id));if(POS)miss.sort((a,b)=>(dist(POS,a)??1e9)-(dist(POS,b)??1e9));
 const m=month();let q=0,v=0;S.orders.filter(o=>o.date.slice(0,7)===m).forEach(o=>o.items.forEach(it=>{if(isFocus(it.code)){q+=it.qty;v+=it.qty*it.price*(1-(it.disc||0)/100)}}));
 return `<div class="card"><h3>⭐ Phủ mã trọng tâm toàn Nghệ An</h3><div class="row"><span class="grow"><b>${got.length}/${st.length}</b> cửa hàng đã có mã trọng tâm</span><b>${pct.toFixed(0)}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="mut">Tháng này: ${fmt(q)} đv · ${fm(v)} · ${S.focus.length} mã đang theo dõi (bấm ☆ trong Kho để thêm/bớt)</div>
 ${miss.length?`<div class="acts"><button class="go" onclick="miss_route()">➕ Đưa ${Math.min(miss.length,20)} cửa hàng chưa có vào tuyến</button><button onclick="openPicker(c=>editProd(c),{cat:'focus'})">Xem mã trọng tâm</button></div>`:''}</div>`}
function miss_route(){const miss=S.stores.filter(s=>s.type!=='Khách lẻ'&&s.status!=='tc'&&!hasFocus(s.id));SUB.route=SUB.route||[];miss.slice(0,20).forEach(s=>{if(!SUB.route.includes(s.id))SUB.route.push(s.id)});try{localStorage.setItem(KEY+'_route',JSON.stringify(SUB.route))}catch(e){};SUB.st='route';go('stores')}

let PK={};
function openPicker(cb,o){o=o||{};PK={cb,q:o.q||'',cat:o.cat||'',size:''};let el=$('picker');if(!el){el=document.createElement('div');el.id='picker';document.body.appendChild(el)}

function closePicker(){const e=$('picker');if(e)e.remove()}

 [['nho','Chai nhỏ'],['to','Can/túi lớn']].map(c=>`<button class="${PK.size===c[0]?'on':''}" onclick="PK.size=PK.size==='${c[0]}'?'':'${c[0]}';pkChips();pkList()">${c[1]}</button>`).join('')}
function filterCat(list,cat,sm){if(!cat)return list;if(cat==='focus')return list.filter(p=>isFocus(p.code));if(cat==='has')return list.filter(p=>(sm[p.code]||0)>0);if(cat==='gift')return GIFT_CANDIDATES.map(c=>PM[c]).filter(Boolean);return list.filter(p=>catOf(p)===cat)}
function pkList(){const sm=stockMap();let list=filterCat(PRODUCTS,PK.cat,sm);if(PK.size)list=list.filter(p=>(KW[p.code]||[]).includes(PK.size==='to'?'lon':'nho'));list=smartSearch(PK.q,list);
 if(!PK.q&&!PK.cat&&!PK.size){$('pk_l').innerHTML=`<div class="catgrid">${CATS.map(c=>`<button onclick="PK.cat='${c[0]}';pkChips();pkList()"><b>${c[1]}</b>${c[2]}</button>`).join('')}</div><h3 style="margin:6px 0">⭐ Mã trọng tâm</h3>`+prodCards(PRODUCTS.filter(p=>isFocus(p.code)),sm,'pick');return}
 $('pk_l').innerHTML=list.length?`<div class="mut" style="margin-bottom:6px">${list.length} sản phẩm</div>`+prodCards(list,sm,'pick'):'<div class="empty">Không thấy. Thử gõ ngắn hơn: “rửa bát”, “giặt”, “lau nhà”, hoặc chọn nhóm ở trên.</div>'}
function prodCards(list,sm,mode){return list.map(p=>{const s=sm[p.code]||0,pr=price(p),c=cost(p);return `<div class="pc" onclick="${mode==='pick'?`PK.cb('${p.code}');closePicker()`:`editProd('${p.code}')`}">${thumb(p)}<div class="grow"><b>${esc(p.name)}</b>

 (AIBUSY?'<div class="ba"><span class="dots">Đang suy nghĩ</span></div>':'');m.scrollTop=m.scrollHeight}
async function aiAddFiles(fl){for(const f of fl){if(f.size>15e6){toast('File quá lớn');continue}
 if(/^image\//.test(f.type)){AIF.push({name:f.name,mime:'image/jpeg',data:await imgB64(f)})}
 else if(f.type==='application/pdf'){AIF.push({name:f.name,mime:f.type,data:await fileB64(f)})}
 else AIF.push({name:f.name,mime:'text/plain',text:await f.text()})}aiFilesRender()}
function aiChip(t){if(t.startsWith('📷'))return $('aicam').click();if(t.startsWith('📎'))return $('aifile').click();$('aiq').value=t;aiSend()}
function aiPick(inp,q){const f=[...inp.files];inp.value='';aiAddFiles(f).then(()=>{if(!$('aiq').value.trim())$('aiq').value=q;aiSend()})}
function aiFilesRender(){$('aifiles').innerHTML=AIF.map((f,i)=>`<span class="tag b">📎 ${esc(f.name)} <a href="#" onclick="event.preventDefault();AIF.splice(${i},1);aiFilesRender()">✕</a></span>`).join('')}
function fileB64(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)})}
function imgB64(f){return new Promise(r=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82).split(',')[1])};img.onerror=()=>fileB64(f).then(r);img.src=URL.createObjectURL(f)})}
async function aiSend(){const q=$('aiq').value.trim();if((!q&&!AIF.length)||AIBUSY)return;
 AIH.push({role:'user',content:q||'Đọc giúp file này',files:AIF.map(f=>f.name).join(', ')});const files=AIF;AIF=[];aiFilesRender();$('aiq').value='';AIBUSY=true;aiRender();
 try{const r=await fetch(aiUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:AIH.slice(-12).map(x=>({role:x.role,content:x.content})),context:aiContext(),files})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Lỗi trợ lý');
  AIH.push({role:'assistant',content:j.reply||'(không có nội dung)',actions:(j.actions||[]).map(a=>({...a,_st:'pending'})),warnings:j.warnings});aiChipsRender(j.suggestions)}
 catch(e){AIH.push({role:'assistant',content:'⚠️ Chưa gọi được Trợ lý AI ('+(e.message||'mất mạng')+'). Em tìm nhanh trong dữ liệu trên máy:\n'+aiLocal(q)})}
 AIBUSY=false;aiSave();aiRender()}

 const sm=stockMap();return l.map(p=>`- **${p.name}** (${p.code}) · thùng ${p.pack} · giá ${fmt(price(p))} · vốn ${fmt(cost(p))} · tồn ${fmt(sm[p.code]||0)} · KM: ${promoText(p)}`).join('\n')}
function aiVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Máy này chưa hỗ trợ nói – dùng bàn phím giọng nói của điện thoại');
 const r=new SR();r.lang='vi-VN';r.interimResults=true;$('aimic').classList.add('on');r.onresult=e=>{$('aiq').value=[...e.results].map(x=>x[0].transcript).join('')};r.onend=()=>{$('aimic').classList.remove('on');if($('aiq').value.trim())aiSend()};r.onerror=()=>$('aimic').classList.remove('on');r.start()}

function matchStore(a){if(a.store_id&&S.stores.find(s=>s.id===a.store_id))return a.store_id;const n=norm(a.store_name||'');if(!n)return'';const s=S.stores.find(s=>norm(s.name)===n)||S.stores.find(s=>norm(s.name).includes(n)||n.includes(norm(s.name)));return s?s.id:''}

function actCard(a,i,j){const id=i+'_'+j;if(a._st==='done')return `<div class="act done">✅ Đã lưu: ${TITLES[a.type]}${a._msg?' · '+esc(a._msg):''}</div>`;if(a._st==='cancel')return `<div class="act done">⛔ Đã hủy: ${TITLES[a.type]}</div>`;
 let h='';const f=(k,l,v,t)=>`<div><label>${l}</label><input data-k="${k}" ${t?'type="'+t+'"':''} value="${esc(v??'')}"></div>`;
 if(a.type==='create_store')h=`<div class="g2">${f('name','Tên *',a.name)}${f('owner','Chủ',a.owner)}${f('phone','SĐT',a.phone)}${f('area','Khu vực',a.area)}</div>${f('address','Địa chỉ',a.address)}${f('notes','Ghi chú',a.notes)}`;
 if(a.type==='log_visit'){if(a._sid===undefined)a._sid=matchStore(a);h=`<label>Cửa hàng</label><select data-k="_sid" class="${a._sid?'':'bad'}">${storeOpts(a._sid)}</select><div class="g2"><div><label>Kết quả</label><select data-k="result">${[['buy','Đặt hàng'],['int','Quan tâm'],['no','Chưa nhu cầu'],['away','Chủ vắng']].map(r=>`<option value="${r[0]}" ${a.result===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>${f('next','Hẹn ghé',a.next,'date')}</div>${f('note','Ghi chú',a.note)}`}
 if(a.type==='set_price'){h=`<label>Sản phẩm</label><select data-k="code">${prodOpts(matchCode(a))}</select><div class="g3">${f('cost','Giá vốn',a.cost)}${f('price','Giá sỉ',a.price)}${f('priceLe','Giá lẻ',a.priceLe)}</div>`}
 if(a.type==='set_focus')h=`<p>${(a.codes||[]).map(c=>esc(PM[c]?PM[c].name:c)).join(', ')} → ${a.on===false?'bỏ':'đặt'} trọng tâm</p>`;
 if(a.type==='stock_in'||a.type==='create_order'){(a.items||[]).forEach(it=>{if(it._code===undefined)it._code=matchCode(it)});
  if(a.type==='create_order'&&a._sid===undefined)a._sid=matchStore(a)||(a.store_name?'__new':'');
  h=(a.type==='stock_in'?`<div class="g2">${f('supplier','NPP',a.supplier||S.settings.npp)}${f('date','Ngày',a.date||today(),'date')}</div>`:`<label>Khách: <b>${esc(a.store_name||'')}</b></label><select data-k="_sid">${storeOpts(a._sid)}</select>`)+
  (a.items||[]).map((it,k)=>`<div class="aitem" data-i="${k}"><select data-ik="_code" class="${it._code?'':'bad'}">${prodOpts(it._code)}</select><div class="mut">AI hiểu: ${esc(it.name||it.code||'')}</div>
  <div class="g3"><div><label>SL</label><input data-ik="qty" inputmode="numeric" value="${it.qty??''}"></div>${a.type==='stock_in'?`<div><label>Tặng</label><input data-ik="free" inputmode="numeric" value="${it.free??0}"></div>`:`<div><label>CK%</label><input data-ik="disc" value="${it.disc??0}"></div>`}<div><label>Đơn giá</label><input data-ik="price" inputmode="numeric" value="${it.price??''}" placeholder="mặc định"></div></div>
  ${(it.gifts||[]).length?`<div class="mut">🎁 ${it.gifts.map(g=>g.qty+' '+esc(PM[g.code]?PM[g.code].name:g.code)).join(', ')}</div>`:''}</div>`).join('')+(a.type==='create_order'?f('paid','Khách trả (trống = trả đủ)',a.paid):'')}

 return `<div class="act" id="act_${id}"><div class="row"><b class="grow">${TITLES[a.type]}</b>${conf?`<span class="tag ${conf<.7?'r':''}">AI chắc ${Math.round(conf*100)}%</span>`:''}</div>${h}
 <div class="row" style="margin-top:8px"><button class="btn gr s" onclick="actDo(${i},${j},0)">Hủy</button><button class="btn s grow" onclick="actDo(${i},${j},1)">✅ Xác nhận lưu</button></div></div>`}
function actRead(a,box){box.querySelectorAll('[data-k]').forEach(e=>{a[e.dataset.k]=e.value});box.querySelectorAll('.aitem').forEach(d=>{const it=a.items[+d.dataset.i];d.querySelectorAll('[data-ik]').forEach(e=>{it[e.dataset.ik]=e.value})})}
function actDo(i,j,ok){const a=AIH[i].actions[j],box=$('act_'+i+'_'+j);if(!ok){a._st='cancel';aiSave();aiRender();return}actRead(a,box);
 const n=v=>v===''||v==null?null:+String(v).replace(/[^\d.-]/g,'');
 try{if(a.type==='create_store'){if(!a.name)throw'Nhập tên cửa hàng';const t=STORE_TYPES.includes(a.type_store)?a.type_store:'Tạp hóa';S.stores.push({id:uid(),created:today(),name:a.name,owner:a.owner,phone:a.phone,address:a.address,area:a.area,type:t,status:'tn',notes:a.notes,lat:null,lng:null});a._msg=a.name}
 if(a.type==='log_visit'){if(!a._sid||a._sid==='__new')throw'Chọn cửa hàng';const s=S.stores.find(x=>x.id===a._sid);S.visits.push({id:uid(),storeId:s.id,date:today(),result:a.result||'int',next:a.next,note:a.note});if(a.next)s.nextVisit=a.next;a._msg=s.name}
 if(a.type==='set_price'){if(!a.code)throw'Chọn sản phẩm';['cost','price','priceLe'].forEach(k=>{if(n(a[k])!=null)setProd(a.code,k,n(a[k]))});a._msg=PM[a.code].name}
 if(a.type==='set_focus'){(a.codes||[]).forEach(c=>{if(PM[c]&&isFocus(c)!==(a.on!==false))toggleFocus(c)})}
 if(a.type==='stock_in'){const items=a.items.filter(it=>it._code&&n(it.qty)>0);if(items.length!==a.items.length)throw'Còn dòng chưa chọn sản phẩm/số lượng';
  S.imports.push({id:uid(),date:a.date||today(),supplier:a.supplier||'',items:items.map(it=>({code:it._code,qty:n(it.qty),free:n(it.free)||0,price:n(it.price)??cost(PM[it._code])}))});S.settings.npp=a.supplier||S.settings.npp;
  items.forEach(it=>{const q=n(it.qty),fr=n(it.free)||0,pr=n(it.price);if(pr!=null)setProd(it._code,'cost',Math.round(q*pr/(q+fr)))});a._msg=items.length+' dòng'}
 if(a.type==='create_order'){const items=a.items.filter(it=>it._code&&n(it.qty)>0);if(!items.length||items.length!==a.items.length)throw'Còn dòng chưa chọn sản phẩm/số lượng';
  let sid=a._sid;if(sid==='__new'){if(!a.store_name)throw'Chưa có tên cửa hàng';const s={id:uid(),created:today(),name:a.store_name,type:'Tạp hóa',status:'mua',lat:null,lng:null};S.stores.push(s);sid=s.id}
  const st=S.stores.find(x=>x.id===sid);const le=!st||st.type==='Khách lẻ';
